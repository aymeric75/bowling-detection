[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling-detection"
version = "1.0.0"
description = "Two-lane bowling pin detection for Raspberry Pi and Coral Edge TPU"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "opencv-python>=4.6", "Pillow>=9", "requests>=2.28"]

[project.scripts]
bowling-detect = "bowling_detection.main:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
